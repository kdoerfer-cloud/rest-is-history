name: Refresh episode data

on:
  schedule:
    - cron: "17 5 * * *"        # 05:17 UTC nightly
  workflow_dispatch:            # ...or run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-episodes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild data/episodes.json from the RSS feed
        run: python3 scripts/build_data.py

      - name: Commit if the feed brought anything new
        run: |
          if git diff --quiet -- data/episodes.json; then
            echo "No change in the feed today."
            exit 0
          fi
          COUNT=$(python3 -c "import json;print(json.load(open('data/episodes.json'))['count'])")
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/episodes.json
          git commit -m "Refresh episode data — ${COUNT} episodes"
          git push
